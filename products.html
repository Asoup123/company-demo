<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
    "https://sdkgiedglmhmchiietru.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   VARIABLES
========================================= */


const productGrid =
    document.getElementById(
        "productGrid"
    );


const modal =
    document.getElementById(
        "productModal"
    );


const modalContent =
    document.getElementById(
        "modalContent"
    );


let allProducts = [];


/* =========================================
   CATEGORY TEXT
========================================= */


const categoryText = {

    all: [
        "全部產品",
        "富致康醫療器材產品一覽"
    ],

    wheelchair: [
        "輪椅系列",
        "各式輪椅與特殊功能輪椅"
    ],

    mobility: [
        "行動輔具",
        "四輪椅、助行器與柺杖等產品"
    ],

    assistive: [
        "照護輔具",
        "馬桶椅、氣墊床等輔具產品"
    ],

    medical: [
        "醫療用品",
        "醫療配件、耗材與相關醫療用品"
    ]

};



/* =========================================
   LOAD PRODUCTS
========================================= */


async function loadProducts() {


    productGrid.innerHTML = `

        <div class="loading-box">

            商品載入中...

        </div>

    `;


    const {
        data,
        error
    } =
        await db

        .from("products")

        .select("*")

        .eq(
            "is_active",
            true
        )

        .order(
            "sort_order",
            {
                ascending: true
            }
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {


        productGrid.innerHTML = `

            <div class="loading-box">

                商品讀取失敗<br>

                ${escapeHTML(error.message)}

            </div>

        `;


        return;

    }


    allProducts =
        data || [];


    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category");


    if (
        category &&
        categoryText[category]
    ) {

        filterProducts(
            category
        );

    } else {

        filterProducts(
            "all"
        );

    }

}



/* =========================================
   FILTER
========================================= */


function filterProducts(category) {


    document
    .querySelectorAll(
        ".category-button"
    )
    .forEach(
        button => {


            button
            .classList
            .toggle(

                "active",

                button.dataset.category
                === category

            );


        }
    );


    document
    .getElementById(
        "categoryTitle"
    )
    .textContent =
        categoryText[category][0];


    document
    .getElementById(
        "categoryDescription"
    )
    .textContent =
        categoryText[category][1];


    const filtered =

        category === "all"

        ?

        allProducts

        :

        allProducts.filter(
            product =>
                product.category
                === category
        );


    renderProducts(
        filtered
    );

}



document
.querySelectorAll(
    ".category-button"
)
.forEach(
    button => {


        button.addEventListener(
            "click",
            function () {


                filterProducts(
                    button.dataset.category
                );


                history.replaceState(

                    null,

                    "",

                    button.dataset.category
                    === "all"

                    ?

                    "products.html"

                    :

                    "products.html?category="
                    +
                    button.dataset.category

                );


            }
        );


    }
);



/* =========================================
   PRODUCT CARDS
========================================= */


function renderProducts(products) {


    productGrid.innerHTML = "";


    if (!products.length) {


        productGrid.innerHTML = `

            <div class="loading-box">

                此分類目前尚未新增商品

            </div>

        `;


        return;

    }


    products.forEach(
        product => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            const image =

                product.image_urls
                &&
                product.image_urls.length

                ?

                product.image_urls[0]

                :

                "";


            const quickSpecs =
                getQuickSpecs(
                    product.specs || []
                );


            card.innerHTML = `


                <div class="product-image">


                    ${
                        product.featured

                        ?

                        `

                        <span class="featured-badge">

                            熱賣商品

                        </span>

                        `

                        :

                        ""
                    }


                    ${
                        image

                        ?

                        `

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeAttribute(product.name)}">

                        `

                        :

                        `

                        <div class="no-image">

                            尚無商品圖片

                        </div>

                        `
                    }


                </div>


                <div class="product-content">


                    <span class="product-type">

                        ${categoryName(product.category)}

                    </span>


                    <h3>

                        ${escapeHTML(product.name)}

                    </h3>


                    <p class="product-intro">

                        ${
                            escapeHTML(

                                product.short_description
                                ||
                                product.description
                                ||
                                "商品詳細資訊請點擊查看。"

                            )
                        }

                    </p>


                    ${
                        quickSpecs
                    }


                    ${
                        product.subsidy

                        ?

                        `

                        <div class="subsidy">

                            補助項目：
                            ${escapeHTML(product.subsidy)}

                        </div>

                        `

                        :

                        ""
                    }


                    <div class="card-buttons">


                        <button
                            class="detail-button"
                            data-product-id="${product.id}">

                            查看詳細資料

                        </button>


                        <a
                            href="index.html#contact"
                            class="contact-button">

                            洽詢此產品

                        </a>


                    </div>


                </div>

            `;


            productGrid
            .appendChild(
                card
            );


        }
    );


    document
    .querySelectorAll(
        ".detail-button"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                function () {


                    openProduct(
                        button.dataset.productId
                    );


                }
            );


        }
    );

}



/* =========================================
   QUICK SPECS
========================================= */


function getQuickSpecs(specs) {


    const preferred = [

        "座寬",
        "承重",
        "淨重",
        "後輪尺寸"

    ];


    const items = [];


    preferred.forEach(
        name => {


            const found =
                specs.find(
                    spec =>
                        spec.name === name
                );


            if (found) {

                items.push(
                    found
                );

            }


        }
    );


    if (!items.length) {

        return "";

    }


    return `

        <div class="quick-specs">

            ${
                items
                .slice(0,4)
                .map(

                    spec => `

                    <div class="quick-spec">

                        <strong>

                            ${escapeHTML(spec.name)}

                        </strong>

                        ${escapeHTML(spec.value)}

                    </div>

                    `

                )
                .join("")
            }

        </div>

    `;

}



/* =========================================
   PRODUCT DETAIL
========================================= */


function openProduct(id) {


    const product =
        allProducts.find(
            item =>
                item.id === id
        );


    if (!product) {

        return;

    }


    const images =
        product.image_urls || [];


    const firstImage =
        images.length

        ?

        images[0]

        :

        "";


    const features =
        product.features || [];


    const specs =
        product.specs || [];


    modalContent.innerHTML = `


        <div class="modal-top">


            <div>


                <div
                    class="main-photo"
                    id="mainPhoto">


                    ${
                        firstImage

                        ?

                        `

                        <img
                            id="mainPhotoImage"
                            src="${escapeAttribute(firstImage)}"
                            alt="${escapeAttribute(product.name)}">

                        `

                        :

                        `

                        <div class="no-image">

                            尚無商品圖片

                        </div>

                        `
                    }


                </div>


                ${
                    images.length > 1

                    ?

                    `

                    <div class="thumbnail-list">

                        ${
                            images.map(

                                (image,index) => `

                                <button
                                    class="thumbnail
                                    ${index === 0 ? "active" : ""}"
                                    data-image="${escapeAttribute(image)}">

                                    <img
                                        src="${escapeAttribute(image)}"
                                        alt="">

                                </button>

                                `

                            ).join("")
                        }

                    </div>

                    `

                    :

                    ""
                }


            </div>


            <div class="modal-info">


                <span class="modal-category">

                    ${categoryName(product.category)}

                </span>


                <h2>

                    ${escapeHTML(product.name)}

                </h2>


                <div class="modal-description">

                    ${
                        escapeHTML(

                            product.description
                            ||
                            product.short_description
                            ||
                            ""

                        )
                    }

                </div>


                ${
                    product.subsidy

                    ?

                    `

                    <div class="modal-subsidy">

                        符合補助項目：
                        ${escapeHTML(product.subsidy)}

                    </div>

                    `

                    :

                    ""
                }


                <a
                    href="index.html#contact"
                    class="modal-contact">

                    洽詢此產品

                </a>


            </div>


        </div>


        ${
            features.length

            ?

            `

            <section class="detail-section">

                <h3>
                    商品特色
                </h3>


                <ul class="feature-list">

                    ${
                        features
                        .map(

                            feature => `

                            <li>

                                ${escapeHTML(feature)}

                            </li>

                            `

                        )
                        .join("")
                    }

                </ul>

            </section>

            `

            :

            ""
        }


        ${
            specs.length

            ?

            `

            <section class="detail-section">

                <h3>
                    產品規格
                </h3>


                <table class="spec-table">

                    <tbody>

                        ${
                            specs
                            .map(

                                spec => `

                                <tr>

                                    <th>

                                        ${escapeHTML(spec.name)}

                                    </th>

                                    <td>

                                        ${escapeHTML(spec.value)}

                                    </td>

                                </tr>

                                `

                            )
                            .join("")
                        }

                    </tbody>

                </table>

            </section>

            `

            :

            ""
        }

    `;


    modal
    .classList
    .add(
        "show"
    );


    document
    .body
    .classList
    .add(
        "modal-open"
    );


    document
    .querySelectorAll(
        ".thumbnail"
    )
    .forEach(
        thumbnail => {


            thumbnail.addEventListener(
                "click",
                function () {


                    document
                    .querySelectorAll(
                        ".thumbnail"
                    )
                    .forEach(
                        item =>
                            item.classList.remove(
                                "active"
                            )
                    );


                    thumbnail
                    .classList
                    .add(
                        "active"
                    );


                    const image =
                        document.getElementById(
                            "mainPhotoImage"
                        );


                    if (image) {

                        image.src =
                            thumbnail.dataset.image;

                    }


                }
            );


        }
    );

}



/* =========================================
   CLOSE MODAL
========================================= */


function closeModal() {


    modal
    .classList
    .remove(
        "show"
    );


    document
    .body
    .classList
    .remove(
        "modal-open"
    );

}



document
.getElementById(
    "modalClose"
)
.addEventListener(
    "click",
    closeModal
);



modal
.addEventListener(
    "click",
    function (event) {


        if (
            event.target === modal
        ) {

            closeModal();

        }


    }
);



document
.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key === "Escape"
        ) {

            closeModal();

        }


    }
);



/* =========================================
   CATEGORY NAME
========================================= */


function categoryName(category) {


    const names = {

        wheelchair:
            "輪椅系列",

        mobility:
            "行動輔具",

        assistive:
            "照護輔具",

        medical:
            "醫療用品",

        repair:
            "輔具維修"

    };


    return (
        names[category]
        ||
        category
    );

}



/* =========================================
   SECURITY
========================================= */


function escapeHTML(value) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}



function escapeAttribute(value) {


    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    );

}



/* =========================================
   START
========================================= */


loadProducts();


</script>


</body>

</html>
